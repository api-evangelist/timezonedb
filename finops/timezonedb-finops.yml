cost_optimization:
  - strategy: Cache responses
    description: Cache timezone lookup results locally since timezone data changes infrequently. This reduces API calls and keeps usage within free tier limits for most applications.
  - strategy: Use annual subscription
    description: Annual plan saves $10/year (approximately 17% savings) compared to monthly billing for commercial users.
  - strategy: Batch lookups
    description: On the free tier, pace requests to stay within the 1 request/second limit to avoid blocked calls.
  - strategy: Evaluate free tier first
    description: The free tier provides full API functionality for non-commercial use. Start free and upgrade only when rate limits become a constraint.

